# Darkula local OTEL Collector configuration (PR 16).
#
# Receives OTLP from Darkula and routes:
#   traces  -> Jaeger (OTLP/gRPC)
#   metrics -> Prometheus scrape endpoint
#
# No debug exporter is configured: it would dump payloads. The Collector
# runs only on the Darkula-owned private `darkula-observability` network.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  otlp/jaeger:
    endpoint: darkula-jaeger:4317
    tls:
      insecure: true
    timeout: 5s
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: false

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
