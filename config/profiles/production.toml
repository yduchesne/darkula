# Darkula production profile.
#
# PR 5 delivers the production Redpanda DataStream driver; S3 object
# storage still fails fast at composition until its PR ships. Darkula
# never silently substitutes a fake for an explicitly selected production
# driver.

[datastream]
driver = "redpanda"

[object_store]
driver = "s3"

[telemetry]
service_name = "darkula-production"
