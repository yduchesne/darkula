# Darkula production profile.
#
# PR 5 delivers the production Redpanda DataStream driver; PR 8 delivers the
# S3-compatible ObjectStore adapter. The remote bucket/credentials are never
# committed here -- inject them via a non-empty environment variable
# (DARKULA_OBJECT_STORE__BUCKET, ...) or the selection fails fast at
# composition. Darkula never silently substitutes a fake for an explicitly
# selected production driver.

[datastream]
driver = "redpanda"

[object_store]
driver = "s3"

[telemetry]
service_name = "darkula-production"
