# Darkula shipped baseline configuration (lowest file layer).
#
# Precedence: code defaults < base < selected profile < local override <
# non-empty environment. This file is the framework baseline: it overrides
# code defaults and is overridden by every upper layer.
#
# PR 4 delivers the PostgreSQL persistence adapter, so the baseline selects
# it. The `development` profile (the default) connects to the Darkula-owned
# Podman PostgreSQL at the host-published 35432 -> container 5432 port; the
# un-prefixed service port 5432 stays inside the Darkula Podman network and
# is what container-to-container consumers should use.

[database]
driver = "postgresql"
host = "darkula-postgres"
port = 5432
name = "darkula"
user = "darkula"
connect_timeout_seconds = 10
pool_min_size = 1
pool_max_size = 4

[datastream]
driver = "fake"
# Container-to-container consumers use the Darkula Redpanda on the Podman
# network at its service port 9092; the host-published 39092 (prefix-3)
# port is for host-side tooling (development profile). Bounded values:
# poll timeout and max records per poll are capped, never unlimited.
bootstrap_servers = "darkula-redpanda:9092"
client_id = "darkula"
poll_timeout_ms = 500
max_poll_records = 100

[object_store]
driver = "local"

[llm]
driver = "fake"
