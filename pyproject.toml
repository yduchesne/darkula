[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darkula"
version = "0.1.0"
description = "Secure evidence-oriented source discovery, crawling, content-extraction, and source-assessment platform."
requires-python = ">=3.14,<3.15"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Darkula contributors" }]
dependencies = [
  # Structured-output response models and the typed configuration skeleton.
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  # Operational telemetry API. PR 2 freezes only the decorator contract; the
  # SDK/exporter composition is owned by PR 3.
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
]

[dependency-groups]
dev = [
  "ruff>=0.16,<0.17",
  "mypy>=1.13,<2",
  "pytest>=9,<10",
  "pytest-cov>=6,<7",
  "pytest-asyncio>=1,<2",
  "pre-commit>=4,<5",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/darkula"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests", "build.sh"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "UP", "C4", "ASYNC", "RUF"]
ignore = ["SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["darkula"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
  "--strict-markers",
  "--cov=darkula",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]
markers = [
  "asyncio: mark a test as running through pytest-asyncio (strict mode)",
]

[tool.coverage.run]
source = ["darkula"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.bandit]
exclude_dirs = [".venv", "tests"]
