name: One-time lockfile security refresh

on:
  push:
    branches:
      - docs/v02-roadmap-and-architecture
    paths:
      - .github/workflows/lockfile-security-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Upgrade only vulnerable locked packages
        run: |
          uv lock \
            --upgrade-package certifi \
            --upgrade-package filelock \
            --upgrade-package opentelemetry-api \
            --upgrade-package virtualenv
      - name: Verify lockfile and dependency audit
        run: |
          uv sync --locked
          uv run pip-audit
      - name: Commit security lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "security: refresh vulnerable locked dependencies"
            git push origin HEAD:docs/v02-roadmap-and-architecture
          fi
